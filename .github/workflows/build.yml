name: Build

on:
  push:
    branches: [master, develop]
    tags: ["v*.*.*"]
    paths-ignore: ["**/*.md", "doc/**"]
  pull_request:
    paths-ignore: ["**/*.md", "doc/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install premake5
        run: winget install -e --id Premake.Premake.5.Beta --accept-source-agreements --accept-package-agreements

      - name: Install v141_xp toolset
        run: |
          $vsinstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vspath = & "$vsinstaller\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vspath) { throw "Visual Studio installation not found" }
          & "$vsinstaller\setup.exe" modify --passive --norestart --installPath "$vspath" `
            --add Microsoft.VisualStudio.Component.VC.v141.x86.x64 `
            --add Microsoft.VisualStudio.Component.WinXP

      - uses: microsoft/setup-msbuild@v2

      - name: Add pdbcopy to PATH
        run: echo "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x86" >> $env:GITHUB_PATH

      - name: Build
        env:
          CL: /MP
        run: |
          $args = @("--file=release.lua", "prepare", "--toolset=vs2022")
          if ("${{ github.ref }}" -like "refs/tags/v*") { $args += "--final-release" }
          & premake5 @args

      - uses: actions/upload-artifact@v4
        with:
          name: modloader-${{ github.sha }}
          path: |
            release/binaries
            release/symbols
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: modloader-${{ github.sha }}
          path: dist/

      - name: Package zip files
        run: |
          cd dist/release
          (cd binaries && zip -r ../../modloader.zip .)
          (cd symbols && zip -r ../../pdb-symbols.zip .)

      - name: Prepare release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os, re, sys
          tag = os.environ["TAG"]
          lines = open("doc/CHANGELOG.md").readlines()
          i = next((i for i, l in enumerate(lines) if l.startswith(tag + " ")), None)
          if i is None:
              sys.exit(f"No changelog for {tag} in CHANGELOG.md")
          j = next((j for j in range(i + 1, len(lines)) if re.match(r"^v\d+\.\d+", lines[j])), len(lines))
          open("release-body.md", "w").writelines(lines[i:j])
          PY

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mod Loader ${{ github.ref_name }}
          body_path: release-body.md
          files: |
            dist/modloader.zip
            dist/pdb-symbols.zip
          fail_on_unmatched_files: true
